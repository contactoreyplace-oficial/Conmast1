<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer IoT Circuit Nodes -->
  <circle cx="256" cy="70" r="14" fill="#06b6d4" filter="url(#glow)" />
  <line x1="256" y1="84" x2="256" y2="140" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />

  <circle cx="256" cy="442" r="14" fill="#06b6d4" filter="url(#glow)" />
  <line x1="256" y1="372" x2="256" y2="428" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />

  <circle cx="70" cy="256" r="14" fill="#06b6d4" filter="url(#glow)" />
  <line x1="84" y1="256" x2="140" y2="256" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />

  <circle cx="442" cy="256" r="14" fill="#06b6d4" filter="url(#glow)" />
  <line x1="372" y1="256" x2="428" y2="256" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />

  <!-- Diagonal Pins -->
  <circle cx="120" cy="120" r="10" fill="#38bdf8" />
  <line x1="128" y1="128" x2="174" y2="174" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <circle cx="392" cy="120" r="10" fill="#38bdf8" />
  <line x1="384" y1="128" x2="338" y2="174" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <circle cx="120" cy="392" r="10" fill="#38bdf8" />
  <line x1="128" y1="384" x2="174" y2="338" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <circle cx="392" cy="392" r="10" fill="#38bdf8" />
  <line x1="384" y1="384" x2="338" y2="338" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <!-- Central Chip Housing -->
  <rect x="140" y="140" width="232" height="232" rx="40" fill="url(#chipGrad)" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Core Microchip Wave Lines & Symbol -->
  <rect x="180" y="180" width="152" height="152" rx="24" fill="#030712" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6" />

  <!-- Central Nexus Ring & Pulse -->
  <circle cx="256" cy="256" r="42" fill="none" stroke="#22d3ee" stroke-width="7" filter="url(#glow)" />
  <circle cx="256" cy="256" r="22" fill="url(#cyanGrad)" />
  <circle cx="256" cy="256" r="9" fill="#ffffff" />

  <!-- Tech Antenna Rays -->
  <path d="M226 216 Q256 195 286 216" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M210 196 Q256 170 302 196" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <path d="M226 296 Q256 317 286 296" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M210 316 Q256 342 302 316" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" opacity="0.7" />
</svg>
